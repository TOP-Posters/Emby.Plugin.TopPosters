name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/TopPosters.Tests.csproj -c Release
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish Emby.Plugin.TopPosters.csproj -c Release -o ./publish -p:Version="${VERSION}.0"
      # Emby has no third-party plugin catalogs: the release carries the dll to copy into the plugins folder.
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/Emby.Plugin.TopPosters.dll
          generate_release_notes: true
